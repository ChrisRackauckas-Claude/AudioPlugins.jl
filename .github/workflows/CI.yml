name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    # Explicit arch axis so include:x86 adds a new cell instead of merging into
    # Julia 1 / ubuntu-latest (which would silently replace the x64 lane).
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - version: "1"
            os: ubuntu-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - name: Install the 32-bit runtime and toolchain (i386)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6:i386 libstdc++6:i386 libgcc-s1:i386 libatomic1:i386 \
            gcc-multilib libc6-dev-i386
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
