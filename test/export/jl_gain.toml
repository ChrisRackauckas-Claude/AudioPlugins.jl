schema = 1

[plugin]
id = "org.sciml.audioplugins.fixture.jlgain"
name = "Fixture Gain (Julia)"
vendor = "AudioPlugins.jl"
version = "0.1.0"
description = "y = bypass ? u : gain * u, from Julia @ccallables trimmed by juliac"
features = ["audio-effect", "utility"]
channels = 2

[abi]
base = "jl_gain"
inputs = [{ name = "u", role = "audio" }, { name = "clock1", role = "clock" }]
output = "y"

[build]
julia = "jl_gain.jl"

[[param]]
id = 0
name = "Gain"
field = "gain"
min = 0.0
max = 4.0
default = 1.0

[[param]]
id = 7
name = "Bypass"
field = "bypass"
min = 0.0
max = 1.0
default = 0.0
stepped = true
ctype = "bool"
