schema = 1

[plugin]
id = "org.sciml.audioplugins.fixture.jleq"
name = "Fixture Peaking EQ (Julia)"
vendor = "AudioPlugins.jl"
version = "0.1.0"
description = "RBJ peaking EQ, coefficients recomputed per sample"
channels = 2

[abi]
base = "jl_eq"
inputs = [{ name = "u", role = "audio" }]
sample_rate_field = "fs"

[build]
julia = "jl_eq.jl"

[[param]]
id = 0
name = "Frequency"
field = "f0"
min = 20.0
max = 20000.0
default = 1000.0

[[param]]
id = 1
name = "Q"
field = "q"
min = 0.1
max = 10.0
default = 0.7071067811865476

[[param]]
id = 2
name = "Gain"
field = "gain_db"
min = -24.0
max = 24.0
default = 6.0

[constants]
enabled = true
